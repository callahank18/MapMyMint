// NEW HANDLE CSV
function handleCSV() {
    const input = document.getElementById("csvFile");
    input.click();

    input.onchange = function () {
        const file = input.files[0];
        if (!file) return;

        originalFileName = file.name.replace(/\.csv$/i, "");

        const reader = new FileReader();

        reader.onload = async function (e) {
            savedCSV = e.target.result;

            const rawRows = savedCSV.split("\n");

            const dataRows = rawRows.filter(line => {
                const trimmed = line.trim();
                return trimmed &&
                    !trimmed.startsWith("Instructions:") &&
                    !trimmed.startsWith("Entry Type,") &&
                    trimmed.replace(/,/g, "") !== "";
            });

            const importPromises = dataRows.map(line => {
                const columns = line.split(",");

                const entryType = (columns[0] || "").trim().toUpperCase();

                if (entryType !== "TRANSACTION" && entryType !== "GOAL") {
                    return null;
                }

                const userId = parseInt(columns[1]) || currentUserId || 1;

                const category = (columns[3] || "").trim();
                const description = (columns[7] || "").trim();
                const amount = parseFloat((columns[8] || "0").replace(/[$,]/g, "")) || 0;

                const goalName = (columns[10] || "").trim();
                const targetAmount = parseFloat((columns[11] || "0").replace(/[$,]/g, "")) || 0;
                const currentAmount = parseFloat((columns[12] || "0").replace(/[$,]/g, "")) || 0;

                let payload = null;

                if (entryType === "TRANSACTION" && category && amount > 0) {
                    payload = {
                        user_id: userId,
                        goal_name: `${category}: ${description || "Transaction"}`,
                        target_amount: amount,
                        current_amount: 0
                    };
                }

                if (entryType === "GOAL" && goalName && targetAmount > 0) {
                    payload = {
                        user_id: userId,
                        goal_name: `Savings: ${goalName}`,
                        target_amount: targetAmount,
                        current_amount: currentAmount
                    };
                }

                if (!payload) return null;

                return fetch("http://127.0.0.1:8000/goals/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }).filter(p => p !== null);

            if (importPromises.length > 0) {
                try {
                    await Promise.all(importPromises);
                    console.log("CSV imported successfully.");

                    if (typeof window.refreshChart === "function") {
                        window.refreshChart();
                    }
                } catch (error) {
                    console.error("Import Error:", error);
                    console.error("Could not save CSV data to the server.");
                }
            } else {
                console.error("No valid CSV rows found.");
            }
        };

        reader.readAsText(file);
    };
}

// NEW DOWNLOAD UPDATED CSV
async function downloadUpdatedCSV() {
    try {
        const response = await fetch(`http://127.0.0.1:8000/goals/${currentUserId}`);

        if (!response.ok) {
            throw new Error("Failed to fetch updated data");
        }

        const goals = await response.json();

        const header = "Entry Type,User ID,Username,Category,Parent Category,Category Limit,Transaction Date,Description,Amount,Transaction Type,Goal Name,Target Amount,Current Amount,Target Date";

        const rows = goals.map(goal => {
            const parts = goal.goal_name.split(": ");
            const category = parts[0] || "";
            const description = parts.slice(1).join(": ") || "";

            return [
                "TRANSACTION",
                goal.user_id,
                "",
                category,
                "",
                "",
                "",
                description,
                goal.target_amount,
                "Expense",
                "",
                goal.target_amount,
                goal.current_amount,
                ""
            ].join(",");
        });

        const csvContent = [header, ...rows].join("\n");

        const blob = new Blob([csvContent], { type: "text/csv" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = originalFileName + "_MapByMint.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    } catch (error) {
        console.error("Export Error:", error);
        console.error("Could not export updated CSV.");
    }
}
