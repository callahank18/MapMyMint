<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MapMyMint</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>

<nav>
    <a href="home.html" class="brand">MapMyMint</a>
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="index.html">View Map</a>
        <a href="buget.html">Budget List</a>
        <a href="login.html">Login</a>
        <select id="theme-switcher" class="theme-switcher">
            <option value="light">Light Theme</option>
            <option value="dark">Dark Theme</option>
            <option value="ocean">Ocean Theme</option>
            <option value="rainbow">Rainbow Theme</option>
        </select>
    </div>
</nav>

<main class="container">
    <div class="register-form">
        <h1>Register</h1>
        <form id="register-form">
            <div class="input-group">
                <label for="name">Username</label>
                <input type="text" id="name" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required>
            </div>
            <button type="submit" class="btn-teal">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</main>

    <script src="auth.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    registerUser();
});
</script>

</body>
</html>
